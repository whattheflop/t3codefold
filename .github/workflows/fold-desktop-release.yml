name: Fold desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Linux desktop and server version
        required: true
        default: 0.4.4
      release_tag:
        description: Optional release tag (defaults to fold-preview-vVERSION)
        required: false
        default: ""
      desktop_only:
        description: Rebuild Linux installers using an already published server version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'whattheflop/T3codefold'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Reserve desktop release tags before building
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || format('fold-preview-v{0}', inputs.version) }}
          CHANNEL: ${{ contains(inputs.version, '-nightly.') && 'nightly' || 'latest' }}
        run: node scripts/prepare-fold-release-tags.ts "$RELEASE_TAG" "fold-desktop-$CHANNEL"
  server:
    needs: prepare
    if: github.repository == 'whattheflop/T3codefold' && !inputs.desktop_only
    uses: ./.github/workflows/fold-server-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}
      channel: ${{ contains(inputs.version, '-nightly.') && 'nightly' || 'latest' }}
  linux:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.server.result == 'success' || (inputs.desktop_only && needs.server.result == 'skipped')) }}
    needs: [prepare, server]
    concurrency:
      group: fold-desktop-linux
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          run-install: true
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick
      - name: Build Linux desktop artifacts
        env:
          FOLD_VERSION: ${{ inputs.version }}
        run: node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 --build-version "$FOLD_VERSION" --output-dir release-assets --verbose
      - uses: actions/upload-artifact@v7
        with:
          name: fold-linux-x64
          path: release-assets/*
          if-no-files-found: error
      - name: Publish Fold desktop feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || format('fold-preview-v{0}', inputs.version) }}
          FOLD_VERSION: ${{ inputs.version }}
        run: node scripts/publish-fold-desktop.ts release-assets "$RELEASE_TAG" "$FOLD_VERSION"
